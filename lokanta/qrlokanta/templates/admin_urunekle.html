<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>QR Menü Admin | GastroPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-to-br from-orange-50 via-white to-orange-100 min-h-screen p-4 md:p-10">

<div class="max-w-3xl mx-auto bg-white p-6 md:p-10 rounded-3xl shadow-2xl border border-orange-100">

    <div class="mb-10 p-6 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">
        <h2 class="font-bold text-slate-700 mb-3 flex items-center gap-2">📂 Kategori Yönetimi</h2>
        <div class="flex gap-2">
            <input id="yeni_kategori_input" type="text" placeholder="Yeni Kategori Adı (Örn: Pizzalar)" 
                   class="flex-1 p-3 rounded-xl border-2 focus:border-orange-500 outline-none">
            <button type="button" onclick="kategoriKaydet()" 
                    class="bg-slate-800 text-white px-6 rounded-xl font-bold hover:bg-slate-700 transition">
                Ekle
            </button>
        </div>
    </div>

    <hr class="mb-10 border-orange-100">

    <form action="{% if urun %}/urun-guncelle/{{urun.id}}{% else %}/adminurunekle{% endif %}" 
          method="POST" enctype="multipart/form-data" class="space-y-6">

        <h1 class="text-4xl font-extrabold text-orange-600 mb-8 flex items-center gap-3">
            <span>🍽️</span> {% if urun %}Ürün Güncelle: {{urun.ad}}{% else %}Yeni Ürün Ekle{% endif %}
        </h1>

        <div>
            <label class="font-bold text-gray-700">Ürün Adı</label>
            <input name="ad" value="{{ urun.ad if urun else '' }}" placeholder="Örn: Izgara Tavuk"
                   class="border-2 p-3 rounded-xl w-full mt-1 focus:border-orange-500 outline-none transition" required>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="font-bold text-gray-700">Fiyat (₺)</label>
                <input type="number" step="0.01" name="fiyat" value="{{ urun.fiyat if urun else '' }}" placeholder="0.00"
                       class="border-2 p-3 rounded-xl w-full mt-1 focus:border-orange-500 outline-none transition" required>
            </div>
            <div>
                <label class="font-bold text-gray-700">Kategori</label>
                <select name="kategori" class="border-2 p-3 rounded-xl w-full mt-1 focus:border-orange-500 outline-none bg-white">
                    {% for kat in kategoriler %}
                    <option value="{{ kat.id }}" {% if urun and urun.kategori_id == kat.id %}selected{% endif %}>
                        {{ kat.ad }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div>
            <label class="font-bold text-gray-700">Stok Durumu</label>
            <select name="stok" class="border-2 p-3 rounded-xl w-full mt-1 outline-none focus:border-orange-500">
                <option value="1" {% if urun and urun.stokta_mi %}selected{% endif %}>Stokta Var</option>
                <option value="0" {% if urun and not urun.stokta_mi %}selected{% endif %}>Tükendi</option>
            </select>
        </div>

        <div>
            <label class="font-bold text-gray-700">Ürün İçeriği / Detay</label>
            <textarea name="icerik" placeholder="Müşteri ürün detayında ne görsün?"
                      class="border-2 p-3 rounded-xl w-full mt-1 focus:border-orange-500 outline-none h-24 transition">{{ urun.aciklama if urun else '' }}</textarea>
        </div>

        <div class="bg-orange-50 p-6 rounded-2xl border-2 border-orange-100 space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-gray-700 flex items-center gap-2">
                    <span>➕</span> Ekstra Seçenekler
                </h3>
                <button type="button" onclick="ekstraSatiriEkle()" 
                        class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md transition">
                    + Yeni Satır
                </button>
            </div>
        
            <div id="ekstraListesi" class="space-y-3">
                {% if ekstralar %}
                    {% for e in ekstralar %}
                    <div class="flex gap-2 animate-in slide-in-from-left duration-300">
                        <input name="ekstra_ad[]" value="{{ e.ekstra_ad }}" placeholder="Ekstra Adı" 
                               class="flex-1 border-2 p-3 rounded-xl outline-none focus:border-orange-500 shadow-sm">
                        <input type="number" step="0.01" name="ekstra_fiyat[]" value="{{ e.ekstra_fiyat }}" 
                               class="w-28 border-2 p-3 rounded-xl outline-none focus:border-orange-500 shadow-sm">
                        <button type="button" onclick="this.parentElement.remove()" class="bg-red-500 text-white w-12 h-12 rounded-xl font-bold">X</button>
                    </div>
                    {% endfor %}
                {% endif %}
            </div>
        </div>

        <div>
            <label class="font-bold text-gray-700">Ürün Görseli</label>
            {% if urun and urun.fotograf_url %}
            <p class="text-xs text-slate-500 mb-1">Mevcut: {{ urun.fotograf_url }}</p>
            {% endif %}
            <input type="file" name="resim" class="w-full p-2 border-2 border-dashed rounded-xl mt-1" {% if not urun %}required{% endif %}>
        </div>

        <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-black text-lg p-5 rounded-2xl w-full shadow-xl transition active:scale-95 uppercase tracking-widest">
            🚀 {% if urun %}Değişiklikleri Güncelle{% else %}Menüye Ekle{% endif %}
        </button>
    </form>
</div>

<script>
    function ekstraSatiriEkle() {
        const liste = document.getElementById("ekstraListesi");
        const yeniSatir = document.createElement("div");
        yeniSatir.className = "flex gap-2 animate-in slide-in-from-right duration-300";
        yeniSatir.innerHTML = `
            <input name="ekstra_ad[]" placeholder="Ekstra Adı" class="flex-1 border-2 p-3 rounded-xl outline-none focus:border-orange-500 shadow-sm" required>
            <input type="number" step="0.01" name="ekstra_fiyat[]" placeholder="Fiyat" class="w-28 border-2 p-3 rounded-xl outline-none focus:border-orange-500 shadow-sm" required>
            <button type="button" onclick="this.parentElement.remove()" class="bg-red-500 text-white w-12 h-12 rounded-xl font-bold">X</button>
        `;
        liste.appendChild(yeniSatir);
    }

    function kategoriKaydet() {
        const ad = document.getElementById("yeni_kategori_input").value;
        if (!ad) { alert("Ad yaz kanka!"); return; }

        const formData = new URLSearchParams();
        formData.append("kategori_ad", ad);

        fetch("/adminurunekle", {
            method: "POST",
            body: formData,
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        }).then(() => window.location.reload());
    }
</script>
</body>
</html>
