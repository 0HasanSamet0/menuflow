<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gusto Pro | QR Menü</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #f8fafc; 
            overflow-x: hidden;
        }

        /* Akıcı Kayma Animasyonu */
        .animate-slide-up {
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Kartlara Özel Cam Efekti */
        .kat-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .kat-card:active {
            transform: scale(0.95);
        }

        /* İkon Arka Plan Gradyanları */
        .icon-bg-orange { background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%); }
        .icon-bg-blue { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); }
        .icon-bg-pink { background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%); }
        .icon-bg-green { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); }

        .glass-header {
            background: rgba(248, 250, 252, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>

<body class="pb-32" onload="kilidiBaslat()"> 

    <nav class="flex justify-between items-center px-6 py-4 sticky top-0 z-50 glass-header border-b border-slate-100">
        <div class="flex flex-col">
            <span class="text-[10px] font-bold text-orange-500 uppercase tracking-[0.2em]">Hoş Geldiniz</span>
            <h1 class="text-xl font-800 tracking-tighter text-slate-900">GUSTO<span class="text-orange-500">PRO</span></h1>
        </div>
        
        <a href="/sepet" onclick="event.preventDefault(); window.location.replace(this.href);" class="relative w-12 h-12 flex items-center justify-center bg-white rounded-2xl shadow-sm border border-slate-100 active:scale-90 transition-all">
            <i class="fa-solid fa-basket-shopping text-slate-700 text-lg"></i>
            {% if session.get('sepet') %}
            <span class="absolute -top-1 -right-1 bg-orange-500 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-white animate-bounce">
                {{ session.get('sepet')|length }}
            </span>
            {% endif %}
        </a>
    </nav>

    <main class="px-6 mt-8 max-w-lg mx-auto">
        <div class="mb-10 animate-slide-up" style="animation-delay: 0.1s;">
            <div class="inline-flex items-center gap-2 bg-white border border-slate-100 px-3 py-1.5 rounded-full mb-4 shadow-sm">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
                </span>
                <span class="text-[11px] font-bold text-slate-600 uppercase tracking-wider">Masa {{ session.get('masa_no', '01') }}</span>
            </div>
            <h2 class="text-4xl font-800 text-slate-900 leading-[1.1] tracking-tight">
                Bugün ne <br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-orange-600">keşfedeceksin?</span>
            </h2>
        </div>

        <div class="grid grid-cols-2 gap-4 animate-slide-up" style="animation-delay: 0.2s;">
            {% for k in kategoriler %}
            <a href="/kategori/{{ k.id }}" onclick="event.preventDefault(); window.location.replace(this.href);" class="kat-card group rounded-[2.5rem] p-6 shadow-sm shadow-slate-200/50">
                <div class="w-16 h-16 rounded-[1.5rem] flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-500
                    {% if 'İçecek' in k.ad %}icon-bg-blue
                    {% elif 'Tatlı' in k.ad %}icon-bg-pink
                    {% elif 'Burger' in k.ad %}icon-bg-orange
                    {% elif 'Pizza' in k.ad %}icon-bg-orange
                    {% else %}icon-bg-green{% endif %}">
                    
                    <i class="fa-solid text-2xl 
                        {% if 'İçecek' in k.ad %}fa-glass-water text-blue-500
                        {% elif 'Tatlı' in k.ad %}fa-ice-cream text-pink-500
                        {% elif 'Burger' in k.ad %}fa-burger text-orange-500
                        {% elif 'Pizza' in k.ad %}fa-pizza-slice text-orange-500
                        {% else %}fa-utensils text-green-500{% endif %}"></i>
                </div>
                
                <h3 class="font-800 text-slate-800 text-lg mb-1">{{ k.ad }}</h3>
                <div class="flex items-center gap-1 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                    <span>İncele</span>
                    <i class="fa-solid fa-arrow-right-long transition-all group-hover:translate-x-1"></i>
                </div>
            </a>
            {% endfor %}
        </div>
    </main>

    <div class="fixed bottom-8 left-0 right-0 px-6 flex justify-center z-50 animate-slide-up" style="animation-delay: 0.4s;">
        <button onclick="garsonCagir()" id="garsonBtn" class="bg-slate-900 text-white pl-4 pr-8 py-3.5 rounded-full shadow-2xl shadow-slate-900/40 flex items-center gap-4 active:scale-95 transition-all">
            <div class="w-10 h-10 bg-orange-500 rounded-full flex items-center justify-center shadow-lg shadow-orange-500/30">
                <i class="fa-solid fa-bell-concierge text-sm animate-pulse"></i>
            </div>
            <span id="btnText" class="font-bold text-sm tracking-wide uppercase">Garsonu Çağır</span>
        </button>
    </div>

    <div id="alert" class="fixed top-6 left-6 right-6 bg-slate-900/95 backdrop-blur-md text-white p-4 rounded-3xl shadow-2xl translate-y-[-200%] transition-all duration-700 z-[100] flex items-center gap-4 border border-white/10">
        <div class="bg-green-500 w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg shadow-green-500/40">
            <i class="fa-solid fa-check text-xl"></i>
        </div>
        <div>
            <p class="font-bold text-sm">Masaya Bildirim Düştü!</p>
            <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mt-0.5">Sizinle hemen ilgileniyoruz.</p>
        </div>
    </div>

    <script>
        // Geri Tuşu Kilidi
        function kilidiBaslat() {
            history.replaceState(null, document.title, location.href);
            history.pushState(null, document.title, location.href);

            window.onpopstate = function () {
                history.pushState(null, document.title, location.href);
                if (confirm("Menüden ayrılmak istediğinize emin misiniz?")) {
                    window.location.replace("https://www.google.com");
                }
            };
        }

        function garsonCagir() {
            const btn = document.getElementById('garsonBtn');
            const btnText = document.getElementById('btnText');
            const alertBox = document.getElementById('alert');
            
            btn.style.opacity = '0.7';
            btn.disabled = true;
            btnText.innerText = "Haber Veriliyor...";

            fetch('/garson-cagir').then(response => {
                if(response.ok) {
                    alertBox.style.transform = 'translateY(0)';
                    setTimeout(() => {
                        alertBox.style.transform = 'translateY(-200%)';
                        btn.style.opacity = '1';
                        btn.disabled = false;
                        btnText.innerText = "Garsonu Çağır";
                    }, 4000);
                }
            });
        }
    </script>
</body>
</html>
