<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroPro | Canlı Kasa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b1120; }
        .siparis-card { animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Not Kutusu Özel Stili */
        .not-kutusu-vurgu {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.2) 0%, rgba(249, 115, 22, 0.05) 100%);
            border-left: 6px solid #f97316;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.1);
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="text-white min-h-screen">

    <div id="overlay" class="fixed inset-0 bg-slate-900 z-[10000] flex items-center justify-center text-center backdrop-blur-2xl">
        <div class="p-8">
            <div class="mb-6"><i class="fa-solid fa-tower-broadcast text-orange-500 text-7xl animate-bounce"></i></div>
            <h2 class="text-4xl font-black mb-6 tracking-tight text-white uppercase">Kasa Terminali Hazır</h2>
            <button onclick="window.sistemiBaslat()" class="bg-orange-500 hover:bg-orange-600 text-white px-16 py-7 rounded-3xl font-black text-2xl shadow-[0_0_50px_rgba(249,115,22,0.3)] active:scale-95 transition-all">
                TAKİBİ BAŞLAT 🚀
            </button>
        </div>
    </div>

    <nav class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900/40 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-5">
            <div id="status-dot" class="w-4 h-4 bg-red-600 rounded-full shadow-[0_0_15px_rgba(220,38,38,0.5)]"></div>
            <h1 class="text-2xl font-black tracking-tighter uppercase italic">KASA<span class="text-orange-500">CANLI</span></h1>
        </div>
        <div id="saat" class="text-3xl font-mono font-black text-orange-500">00:00:00</div>
    </nav>

    <div class="p-8 max-w-[1900px] mx-auto">
        <div id="kasa-alani" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-8"></div>
    </div>

    <audio id="order-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        let socket;
        const lokantaUuid = "{{ session.get('lokanta_uuid') }}";

        window.sistemiBaslat = function() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('status-dot').className = "w-4 h-4 bg-emerald-500 rounded-full animate-ping";
            
            socket = io({ transports: ['websocket'] });
            socket.on('connect', () => { socket.emit('join_room', { room: lokantaUuid }); });
            socket.on('yeni_siparis', () => { document.getElementById('order-sound').play(); window.verileriCek(); });
            
            setInterval(() => { document.getElementById('saat').innerText = new Date().toLocaleTimeString('tr-TR'); }, 1000);
            window.verileriCek();
        }

        window.verileriCek = function() {
            fetch('/api/kasa_verisi')
                .then(res => res.json())
                .then(data => {
                    const alan = document.getElementById('kasa-alani');
                    alan.innerHTML = '';
                    
                    if (!data || data.length === 0) {
                        alan.innerHTML = `<div class="col-span-full text-center py-60 opacity-20 text-3xl font-black uppercase tracking-[0.2em]">Bekleyen Sipariş Yok</div>`;
                        return;
                    }

                    data.forEach(s => {
                        let isGarson = s.durum === 'Garson Çağırıyor';
                        let urunlerHtml = '';

                        if(s.urunler && s.urunler.length > 0) {
                            s.urunler.forEach(u => {
                                let ekstralar = u.ekstralar ? `<div class="text-[13px] text-emerald-400 font-bold mt-1 uppercase leading-tight">+ ${u.ekstralar}</div>` : '';
                                
                                // ŞEF NOTU - Dev Boyut ve Vurgu
                                let not = u.notlar ? `
                                    <div class="not-kutusu-vurgu p-3 rounded-r-xl mt-3 text-white">
                                        <div class="flex items-center gap-2 mb-1 text-orange-400">
                                            <i class="fa-solid fa-comment-dots text-sm"></i>
                                            <span class="text-[10px] font-black uppercase tracking-widest">MÜŞTERİ NOTU</span>
                                        </div>
                                        <div class="text-base font-extrabold leading-snug break-words">"${u.notlar}"</div>
                                    </div>` : '';
                                
                                urunlerHtml += `
                                    <div class="p-4 bg-slate-900/90 rounded-3xl mb-4 border border-white/5 shadow-2xl">
                                        <div class="flex justify-between items-start gap-3">
                                            <span class="text-base font-black text-white leading-tight uppercase">${u.urun_ad}</span>
                                            <span class="bg-orange-500 px-3 py-1 rounded-xl text-sm font-black text-white shadow-lg whitespace-nowrap">x${u.adet}</span>
                                        </div>
                                        ${ekstralar} ${not}
                                    </div>`;
                            });
                        }

                        const cardClass = isGarson 
                            ? "bg-red-600/10 border-red-500 shadow-[0_0_40px_rgba(220,38,38,0.2)] animate-pulse" 
                            : "bg-slate-800/60 border-slate-700 shadow-2xl";

                        const headerBadge = isGarson
                            ? `<div class="flex flex-col gap-1">
                                <span class="bg-red-600 text-white px-4 py-1.5 rounded-xl text-xs font-black uppercase animate-bounce flex items-center gap-2 italic shadow-lg">
                                   <i class="fa-solid fa-bell"></i> GARSON ÇAĞIRIYOR!
                                </span>
                                <span class="text-3xl font-black text-white tracking-tighter">MASA ${s.masa_no}</span>
                               </div>`
                            : `<div class="flex flex-col">
                                <span class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Masa</span>
                                <span class="text-4xl font-black text-white italic tracking-tighter">MASA ${s.masa_no}</span>
                               </div>`;

                        alan.innerHTML += `
                            <div class="siparis-card ${cardClass} border-2 p-6 rounded-[3rem] flex flex-col h-full transition-all">
                                <div class="flex justify-between items-start mb-6">
                                    ${headerBadge}
                                    <div class="bg-black/40 px-3 py-2 rounded-2xl border border-white/5">
                                        <span class="text-[12px] font-mono font-black text-orange-500">${s.tarih}</span>
                                    </div>
                                </div>
                                
                                <div class="flex-1 custom-scrollbar overflow-y-auto max-h-[500px] pr-2 mb-6">
                                    ${isGarson ? '<div class="h-40 flex items-center justify-center text-red-500 font-black text-xl animate-pulse italic">ACİL GARSON BEKLİYOR!</div>' : urunlerHtml}
                                </div>

                                <div class="mt-auto">
                                    <button onclick="window.siparisTamamla(${s.id})" 
                                        class="w-full ${isGarson ? 'bg-red-600' : 'bg-emerald-600'} hover:scale-[1.02] active:scale-95 py-6 rounded-2xl font-black text-lg shadow-[0_10px_30px_rgba(0,0,0,0.3)] transition-all flex items-center justify-center gap-4">
                                        <i class="fa-solid ${isGarson ? 'fa-person-running' : 'fa-check-double'} text-2xl"></i>
                                        ${isGarson ? 'GİDİLDİ' : 'TESLİM EDİLDİ'}
                                    </button>
                                </div>
                            </div>`;
                    });
                })
                .catch(err => console.error("API Error:", err));
        }

        window.siparisTamamla = function(id) {
            fetch('/api/siparis-tamamla/' + id, { method: 'POST' })
                .then(res => res.json())
                .then(data => { 
                    if(data.success) { window.verileriCek(); } 
                    else { alert("Hata: " + data.message); }
                });
        }
    </script>
</body>
</html>
