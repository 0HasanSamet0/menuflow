<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroPro | Canlı Kasa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; }
        .siparis-card { animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* Şefe not için özel bir parlama efekti */
        .not-flash { border-left: 4px solid #f97316; animation: shadow-pulse 2s infinite; }
        @keyframes shadow-pulse { 0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.2); } 70% { box-shadow: 0 0 0 10px rgba(249, 115, 22, 0); } 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); } }
    </style>
</head>
<body class="text-white min-h-screen overflow-x-hidden">

    <div id="overlay" class="fixed inset-0 bg-slate-900 z-[10000] flex items-center justify-center text-center backdrop-blur-xl">
        <div class="p-8">
            <div class="mb-6">
                <i class="fa-solid fa-satellite-dish text-orange-500 text-6xl animate-pulse"></i>
            </div>
            <h2 class="text-3xl font-black mb-6 tracking-tight text-white">SİSTEM ÇEVRİMİÇİ</h2>
            <button onclick="sistemiBaslat()" class="bg-orange-500 hover:bg-orange-600 text-white px-14 py-6 rounded-full font-black text-2xl shadow-2xl shadow-orange-500/20 active:scale-95 transition-all">
                🚀 TAKİBİ BAŞLAT
            </button>
        </div>
    </div>

    <nav class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-ping"></div>
            <h1 class="text-2xl font-black tracking-tighter italic">KASA<span class="text-orange-500">CANLI</span></h1>
        </div>
        <div id="saat" class="text-2xl font-mono font-bold text-slate-300 bg-slate-800 px-5 py-2 rounded-2xl border border-slate-700">00:00:00</div>
    </nav>

    <div class="p-8 max-w-[1600px] mx-auto">
        <div id="kasa-alani" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            </div>
    </div>

    <audio id="order-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        // Socket bağlantısını daha sağlam hale getirdik
        const socket = io({
            transports: ['websocket', 'polling']
        });

        function verileriCek() {
            fetch('/api/kasa_verisi')
                .then(res => res.json())
                .then(data => {
                    const alan = document.getElementById('kasa-alani');
                    if (!data || data.length === 0) {
                        alan.innerHTML = `
                            <div class="col-span-full flex flex-col items-center justify-center py-40 opacity-30">
                                <i class="fa-solid fa-box-open text-8xl mb-6"></i>
                                <p class="text-2xl font-bold uppercase tracking-widest">Bekleyen Sipariş Yok</p>
                            </div>`;
                        return;
                    }

                    alan.innerHTML = '';
                    
data.forEach(s => {
    // 1. DURUM KONTROLÜ: Garson mu yoksa normal sipariş mi?
    const isGarson = (s.durum === 'Garson Çağırıyor' || (s.urunler && s.urunler.length === 0));
    
    let urunlerHtml = '';
    let kartRengi = "bg-slate-800 border-slate-700 shadow-2xl";
    let butonRengi = "bg-green-600 hover:bg-green-500";
    let butonMetni = "TESLİM EDİLDİ";
    let butonIkon = "fa-check-double";

    if (isGarson) {
        // GARSON ÇAĞRISI ÖZEL TASARIMI
        kartRengi = "bg-red-900/90 border-red-500 shadow-[0_0_40px_rgba(239,68,68,0.4)] animate-pulse";
        butonRengi = "bg-red-600 hover:bg-red-500";
        butonMetni = "GİTTİM / TAMAM";
        butonIkon = "fa-bell-slash";
        
        urunlerHtml = `
            <div class="flex flex-col items-center justify-center py-12 text-center">
                <div class="w-24 h-24 bg-red-500 rounded-full flex items-center justify-center mb-6 shadow-xl shadow-red-500/50">
                    <i class="fa-solid fa-bell-concierge text-4xl text-white animate-bounce"></i>
                </div>
                <h3 class="text-2xl font-black text-white uppercase tracking-tighter">GARSON ÇAĞRISI</h3>
                <p class="text-sm text-red-200 mt-2 font-bold italic tracking-wide">Masa ${s.masa_no} sizi bekliyor!</p>
            </div>`;
    } else {
        // NORMAL SİPARİŞ TASARIMI (Eski Kodun)
        s.urunler.forEach(u => {
            let ekstralar = u.ekstralar ? `<div class="text-[12px] text-emerald-400 font-bold mt-1"><i class="fa-solid fa-circle-plus"></i> ${u.ekstralar}</div>` : '';
            let not = u.notlar ? `<div class="not-flash text-[11px] bg-orange-500/10 p-3 rounded-xl mt-2 text-orange-200 border border-orange-500/20">"${u.notlar}"</div>` : '';

            urunlerHtml += `
                <div class="p-4 bg-slate-900/60 rounded-2xl mb-3 border border-white/5">
                    <div class="flex justify-between items-center gap-2">
                        <span class="text-sm font-extrabold text-slate-100">${u.urun_ad}</span>
                        <span class="bg-orange-500 text-white px-2 py-0.5 rounded-lg font-black text-xs">x${u.adet}</span>
                    </div>
                    ${ekstralar} ${not}
                </div>`;
        });
    }

    alan.innerHTML += `
        <div class="siparis-card ${kartRengi} border-2 p-6 rounded-[2.5rem] flex flex-col h-full transition-all">
            <div class="flex justify-between items-center mb-5">
                <span class="${isGarson ? 'bg-white text-red-600' : 'bg-orange-600 text-white'} px-5 py-1.5 rounded-xl text-sm font-black italic shadow-lg uppercase">
                    MASA ${s.masa_no}
                </span>
                <span class="text-[11px] text-slate-400 font-bold font-mono">${s.tarih}</span>
            </div>

            <div class="flex-1 custom-scrollbar overflow-y-auto max-h-[400px] mb-5">
                ${urunlerHtml}
            </div>

            <div class="pt-5 border-t border-slate-700/50 mt-auto">
                <button onclick="siparisTamamla(${s.id})" class="w-full ${butonRengi} text-white py-4 rounded-2xl font-black text-sm shadow-xl active:scale-95 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid ${butonIkon} text-lg"></i> ${butonMetni}
                </button>
            </div>
        </div>`;
});
                })
                .catch(err => console.error("Hata:", err));
        }

        // --- KRİTİK NOKTA: Sinyal Gelince Çalışacak Kısım ---
        socket.on('connect', () => { console.log("Sunucuya bağlandık kanka! ✅"); });

        socket.on('yeni_siparis', function(msg) {
            console.log("ANLIK SİNYAL GELDİ! 🚀");
            const sound = document.getElementById('order-sound');
            sound.currentTime = 0; 
            sound.play().catch(e => console.warn("Ses için kullanıcı etkileşimi lazım."));
            verileriCek(); 
        });

        function siparisTamamla(id) {
            fetch('/api/siparis-tamamla/' + id, { method: 'POST' })
                .then(res => res.json())
                .then(data => { if(data.success) verileriCek(); });
        }

        function sistemiBaslat() {
            document.getElementById('overlay').style.display = 'none';
            verileriCek();
            setInterval(() => { 
                document.getElementById('saat').innerText = new Date().toLocaleTimeString('tr-TR'); 
            }, 1000);
        }
    </script>
</body>
</html>
