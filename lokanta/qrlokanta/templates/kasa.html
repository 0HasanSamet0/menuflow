<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroPro | Canlı Kasa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; }
        .siparis-card { animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="text-white min-h-screen">

    <div id="overlay" class="fixed inset-0 bg-slate-900 z-[10000] flex items-center justify-center text-center backdrop-blur-xl">
        <div class="p-8">
            <div class="mb-6"><i class="fa-solid fa-satellite-dish text-orange-500 text-6xl animate-pulse"></i></div>
            <h2 class="text-3xl font-black mb-6 tracking-tight text-white">SİSTEM ÇEVRİMİÇİ</h2>
            <button onclick="sistemiBaslat()" class="bg-orange-500 hover:bg-orange-600 text-white px-14 py-6 rounded-full font-black text-2xl shadow-2xl active:scale-95 transition-all">
                🚀 TAKİBİ BAŞLAT
            </button>
        </div>
    </div>

    <nav class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900/60 sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div id="status-dot" class="w-3 h-3 bg-red-500 rounded-full"></div>
            <h1 class="text-2xl font-black tracking-tighter italic">KASA<span class="text-orange-500">CANLI</span></h1>
        </div>
        <div id="saat" class="text-2xl font-mono font-bold text-slate-300 bg-slate-800 px-5 py-2 rounded-2xl border border-slate-700">00:00:00</div>
    </nav>

    <div class="p-8 max-w-[1600px] mx-auto">
        <div id="kasa-alani" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </div>

    <audio id="order-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        let socket;
        const lokantaUuid = "{{ session.get('lokanta_uuid') }}";

        window.sistemiBaslat = function() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('status-dot').className = "w-3 h-3 bg-green-500 rounded-full animate-ping";

            socket = io({ transports: ['websocket'] });

            socket.on('connect', () => {
                socket.emit('join_room', { room: lokantaUuid });
            });

            socket.on('yeni_siparis', function(msg) {
                document.getElementById('order-sound').play();
                window.verileriCek();
            });

            setInterval(() => { document.getElementById('saat').innerText = new Date().toLocaleTimeString('tr-TR'); }, 1000);
            window.verileriCek();
        }

        window.verileriCek = function() {
            fetch('/api/kasa_verisi')
                .then(res => res.json())
                .then(data => {
                    const alan = document.getElementById('kasa-alani');
                    alan.innerHTML = '';
                    
                    if (!data || data.length === 0) {
                        alan.innerHTML = `<div class="col-span-full text-center py-40 opacity-30 text-2xl font-bold">Bekleyen Sipariş Yok</div>`;
                        return;
                    }

                    data.forEach(s => {
                        let urunlerHtml = '';
                        s.urunler.forEach(u => {
                            let ekstralar = u.ekstralar ? `<div class="text-[12px] text-emerald-400 font-bold mt-1">+ ${u.ekstralar}</div>` : '';
                            let not = u.notlar ? `<div class="text-[11px] bg-orange-500/10 p-2 rounded-lg mt-1 text-orange-200">"${u.notlar}"</div>` : '';
                            
                            urunlerHtml += `
                                <div class="p-3 bg-slate-900/60 rounded-xl mb-2 border border-white/5">
                                    <div class="flex justify-between items-center text-sm font-bold text-slate-100">
                                        <span>${u.urun_ad}</span>
                                        <span class="bg-orange-500 px-2 py-0.5 rounded-md text-xs">x${u.adet}</span>
                                    </div>
                                    ${ekstralar} ${not}
                                </div>`;
                        });

                        alan.innerHTML += `
                            <div class="siparis-card bg-slate-800 border-slate-700 border-2 p-6 rounded-[2rem] flex flex-col h-full">
                                <div class="flex justify-between items-center mb-4">
                                    <span class="bg-orange-600 px-4 py-1 rounded-lg text-sm font-black italic uppercase">Masa ${s.masa_no}</span>
                                    <span class="text-[11px] text-slate-400 font-mono">${s.tarih}</span>
                                </div>
                                <div class="flex-1 overflow-y-auto mb-4">${urunlerHtml}</div>
                                <button onclick="window.siparisTamamla(${s.id})" class="w-full bg-green-600 hover:bg-green-500 py-3 rounded-xl font-black text-sm transition-all active:scale-95">
                                    TESLİM EDİLDİ
                                </button>
                            </div>`;
                    });
                })
                .catch(err => console.error("Veri çekme hatası:", err));
        }

        window.siparisTamamla = function(id) {
            fetch('/api/siparis-tamamla/' + id, { method: 'POST' })
                .then(res => res.json())
                .then(data => { 
                    if(data.success) {
                        window.verileriCek(); 
                    } else {
                        alert("İşlem başarısız!");
                    }
                });
        }
    </script>
</body>
</html>
