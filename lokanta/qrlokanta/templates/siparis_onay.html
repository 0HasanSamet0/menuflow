<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sipariş Alındı! | GastroPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; }
        
        .check-animation {
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6 text-center">

    <div class="max-w-sm w-full">
        <div class="check-animation mb-8 relative inline-block">
            <div class="w-32 h-32 bg-green-100 rounded-full flex items-center justify-center mx-auto">
                <i class="fa-solid fa-check text-5xl text-green-600"></i>
            </div>
            <div class="absolute -top-2 -right-2 w-8 h-8 bg-orange-100 rounded-full animate-bounce"></div>
            <div class="absolute -bottom-2 -left-2 w-6 h-6 bg-blue-100 rounded-full"></div>
        </div>

        <h1 class="text-3xl font-800 text-gray-900 mb-4 tracking-tighter">Sipariş Alındı!</h1>
        <p class="text-gray-500 mb-2 leading-relaxed font-medium">
            Harika seçim kanka! Şefimiz hazırlıklara başladı.
        </p>
        <div class="inline-block px-4 py-2 bg-slate-50 rounded-2xl border border-slate-100 mb-10">
            <span class="text-xs font-black text-slate-400 uppercase tracking-widest">Masa</span>
            <span class="text-lg font-900 text-orange-600 ml-1">#{{ session.get('masa_no', '??') }}</span>
        </div>

        <div class="space-y-4">
            <a href="/menu/{{ u_id }}/{{ m_no }}" onclick="event.preventDefault(); window.location.replace(this.href);"
            class="block w-full bg-gray-900 text-white py-5 rounded-3xl font-800 text-lg shadow-xl shadow-gray-200 active:scale-95 transition-all uppercase">
             MENÜYE GERİ DÖN
         </a>
            
            <a href="/siparislerim" onclick="event.preventDefault(); window.location.replace(this.href);" class="block w-full bg-orange-50 text-orange-600 py-5 rounded-3xl font-800 text-lg hover:bg-orange-100 active:scale-95 transition-all">
                SİPARİŞLERİMİ TAKİP ET
            </a>
        </div>

        <p class="mt-12 text-[11px] text-gray-400 font-bold uppercase tracking-[3px]">
            GastroPro <span class="text-orange-300">Smart Menu</span>
        </p>
    </div>

</body>
</html>
