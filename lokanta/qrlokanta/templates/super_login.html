<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gusto Pro | Süper Admin Girişi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-slate-800 tracking-tighter">GUSTO <span class="text-orange-500">PRO</span></h1>
            <p class="text-slate-500 mt-2 font-medium italic underline decoration-orange-300">Süper Admin Paneli</p>
        </div>

        {% if error %}
        <div class="bg-red-50 text-red-600 p-4 rounded-xl mb-6 text-sm font-bold border border-red-100">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="/super-admin/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Yönetici Adı</label>
                <input type="text" name="username" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-orange-500 transition-all" placeholder="Kullanıcı adın..." required>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Güvenlik Şifresi</label>
                <input type="password" name="password" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-orange-500 transition-all" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-bold text-lg hover:bg-orange-600 shadow-lg shadow-orange-200 transition-all transform hover:-translate-y-1">
                Sisteme Giriş Yap
            </button>
        </form>

        <p class="text-center text-slate-400 text-xs mt-8 font-medium">
            &copy; 2024 Gusto Pro Management System
        </p>
    </div>

</body>
</html>
